name: Public offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run only public-fixture tests
        run: python tools/run_public_tests.py
      - name: Check public repository contents and checksums
        run: python tools/verify_public_tree.py
