name: Public offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run only public-fixture tests
        run: python tools/run_public_tests.py
      - name: Check public repository contents and checksums
        run: python tools/verify_public_tree.py
      - name: Assemble and verify the fullscreen PC lab ZIP
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -r requirements-asm-laboratorio.txt
          python tools/build_fullscreen_lab.py "$RUNNER_TEMP"
      - name: Publish the PC lab ZIP
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/NAC_Fullscreen_Lab_44.07.33.32.zip
          archive: false
          if-no-files-found: error
